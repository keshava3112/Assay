<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assay: lists you can prove</title>
<meta name="description" content="Assay finds companies that match your criteria and proves every check with a quote from the source.">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Sets">
    <a class="brand" href="#/"><img src="/static/logo.svg" alt="" width="34" height="34"><span>Assay</span></a>
    <p class="brand-line">Lists you can prove</p>
    <div class="rail-head">Your sets</div>
    <nav id="sets"></nav>
    <div class="rail-foot">
      <a href="https://github.com/keshava3112/Assay" target="_blank" rel="noopener">Source on GitHub</a>
      <span id="mode-label"></span>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Evidence"></aside>
<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!-- data -->
<script type="module" src="/static/app.js"></script>
</body>
</html>
