name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Demo runs end to end, offline
        env:
          ASSAY_OFFLINE: "1"
        run: |
          assay --db /tmp/ci.db demo --no-serve
          assay --db /tmp/ci.db site --out /tmp/site
          test -f /tmp/site/index.html && test -f /tmp/site/static/data.js
