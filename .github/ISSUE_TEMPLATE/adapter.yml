name: New search backend or judge
description: Propose an adapter (a search API, a fetcher, a model provider, a notifier).
labels: [adapter]
body:
  - type: input
    id: name
    attributes:
      label: Service
      placeholder: Tavily, Kagi, Ollama, Teams webhook…
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: Coverage, cost, privacy, or something else. Which port does it implement?
    validations:
      required: true
